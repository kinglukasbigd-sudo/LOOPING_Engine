# Every check on every push. No sound card and no display: the engine runs
# through its offline path, the panel's gestures are pressed in headless
# chromium, and the one check that needs a file-dialog program prints SKIP with
# its reason, which `python -m tests` lists by name at the end.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The Python the suite is run on locally.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: pip

      # test_zoom runs the panel's own view.js under node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      # tests/test_panel.py drives the panel in a real browser. --with-deps
      # brings the system libraries chromium needs on a bare runner; without
      # this step those checks would SKIP rather than run.
      #
      # Kept between runs, because the download is the one part of this that
      # depends on somebody else's server being well: a run on 1 Oct 2026 sat
      # in this step until the job's own 15-minute limit cancelled it, and not
      # one check had been attempted. Cached, the usual run restores it in
      # seconds; cold, the step has a limit of its own, so a slow mirror costs
      # the browser checks rather than the whole suite.
      - name: Keep the browser between runs
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pylibs/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0

      - name: Install the browser the panel tests drive
        timeout-minutes: 6
        continue-on-error: true
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pylibs/ms-playwright
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      # Whatever happened above, the checks run. Without the browser the panel
      # ones print SKIP with the reason and `python -m tests` names them at the
      # end, which is a far better answer than a job that was cancelled before
      # it could say anything at all.
      - name: Run every check
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pylibs/ms-playwright
        run: python -m tests
