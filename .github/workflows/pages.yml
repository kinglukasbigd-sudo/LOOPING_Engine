# The page in site/ goes live on every push to main. Pages has to be switched on
# once by hand — Settings -> Pages -> Source: GitHub Actions — because the
# token a workflow is given cannot turn it on for the repository. The folder is
# uploaded as the site root, which is why the address has no /site/ in it.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # site/ as it stands: one page and one screenshot, no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
